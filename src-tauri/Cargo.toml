[package]
name = "fontcatch"
version = "0.4.0"
description = "Catch your next typeface."
license = "MIT"
authors = ["Fontcatch"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "fontcatch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
notify = "8"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tempfile = "3"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
trash = "5"
url = "2"
walkdir = "2"
plist = "1"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
rusqlite = { version = "0.37", features = ["bundled"] }
read-fonts = { version = "0.46.0", default-features = false, features = ["std"] }
ttf2woff2 = { version = "=0.14.1", default-features = false }

[dev-dependencies]
wuff = { version = "0.2.9", default-features = false, features = ["brotli"] }

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSWindow", "NSView", "NSColor", "objc2-quartz-core", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSAttributedString"] }

objc2 = "0.6"
objc2-foundation = { version = "0.3.2", features = ["NSAttributedString", "NSString", "NSRange"] }

[target.'cfg(unix)'.dependencies]
xattr = "1"
libc = "0.2"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "debuginfo"
