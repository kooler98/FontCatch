name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_preview:
        description: Publish a Windows preview after all checks pass
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Test frontend logic
        run: npm test
      - name: Test native launcher
        run: npm run test:tooling
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test browser interactions
        run: npm run test:ui
      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high

  native:
    name: macOS Rust checks
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend assets
        run: npm run build
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Check Rust lints
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Test Rust logic
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  windows:
    name: Windows x64 checks and installer
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
          components: clippy
      - name: Install frontend dependencies
        run: npm ci
      - name: Test native launcher
        run: npm run test:tooling
      - name: Build frontend assets
        run: npm run build
      - name: Check Windows Rust lints
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc --all-targets -- -D warnings
      - name: Test Windows Rust logic
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
      - name: Test native user-font installation and removal
        env:
          FONTCATCH_WINDOWS_SMOKE: "1"
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc installer::windows::tests::windows_native_install_uninstall_smoke -- --ignored --exact --nocapture
      - name: Build unsigned NSIS installer
        run: npm run desktop:build -- --ci --no-sign --target x86_64-pc-windows-msvc --bundles nsis -- --locked
      - name: Check packaged app startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fontcatchExe = (Resolve-Path 'src-tauri/target/x86_64-pc-windows-msvc/release/fontcatch.exe').Path
          # Tauri app_data_dir is FOLDERID_RoamingAppData / bundle identifier.
          $fontcatchDatabase = Join-Path ([Environment]::GetFolderPath('ApplicationData')) 'app.fontcatch.desktop/library.sqlite'
          if (Test-Path $fontcatchDatabase) {
            throw 'Expected a fresh Fontcatch database on this disposable runner.'
          }
          $fontcatchProcess = Start-Process -FilePath $fontcatchExe -ArgumentList '--autostart' -PassThru
          try {
            Start-Sleep -Seconds 10
            $fontcatchProcess.Refresh()
            if ($fontcatchProcess.HasExited) {
              throw "Fontcatch exited during startup (code $($fontcatchProcess.ExitCode))."
            }
            if (!(Test-Path -Path $fontcatchDatabase -PathType Leaf) -or (Get-Item $fontcatchDatabase).Length -eq 0) {
              throw 'Fontcatch did not initialize its library database.'
            }
            Write-Host 'Fontcatch stayed running and initialized its library database.'
          } finally {
            $fontcatchProcess.Refresh()
            if (!$fontcatchProcess.HasExited) {
              Stop-Process -Id $fontcatchProcess.Id -Force
              $fontcatchProcess.WaitForExit(5000) | Out-Null
            }
            $fontcatchProcess.Dispose()
          }
      - name: Upload unsigned Windows installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Fontcatch-Windows-x64-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish_preview:
    name: Publish Windows preview
    needs: [frontend, native, windows]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_preview && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out verified source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Check release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, tomllib
          from pathlib import Path

          package = json.loads(Path('package.json').read_text())
          tauri = json.loads(Path('src-tauri/tauri.conf.json').read_text())
          cargo = tomllib.loads(Path('src-tauri/Cargo.toml').read_text())
          version = package['version']
          if not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version):
              raise SystemExit('Expected a numeric release version.')
          if version != tauri['version'] or version != cargo['package']['version']:
              raise SystemExit('Package, Tauri and Cargo versions must agree.')
          if tauri['productName'] != 'Fontcatch':
              raise SystemExit('Unexpected installer product name.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY
      - name: Download and verify this run's installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FONTCATCH_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "Fontcatch-Windows-x64-unsigned-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --dir "$RUNNER_TEMP/fontcatch-preview"
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path

          directory = Path(os.environ['RUNNER_TEMP']) / 'fontcatch-preview'
          version = os.environ['FONTCATCH_VERSION']
          installer = directory / f'Fontcatch_{version}_x64-setup.exe'
          if list(directory.iterdir()) != [installer] or installer.is_symlink() or not installer.is_file():
              raise SystemExit('Expected exactly one installer matching the verified version.')
          with installer.open('rb') as source:
              if source.read(2) != b'MZ':
                  raise SystemExit('Installer is not a Windows executable.')
              source.seek(0)
              digest = hashlib.file_digest(source, 'sha256').hexdigest()
          (directory / 'SHA256SUMS.txt').write_text(f'{digest}  {installer.name}\n')
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          (directory / 'release-notes.md').write_text(f'''Windows x64 preview of Fontcatch {version}.

          Download the `.exe` installer and open Fontcatch from the Start menu. Installation is configured for the current user. The installer downloads WebView2 if it is missing.

          [Verified CI run]({run_url}) built this installer from commit `{os.environ['GITHUB_SHA']}` after frontend, macOS and Windows checks passed. Windows checks cover Rust tests, native font registration and removal, and app startup with database initialization.

          This installer is unsigned. Windows may warn about or block it. CI runs on Windows Server 2022 x64 with an administrator account; manual Windows 10/11 checks remain pending, including tray behavior, display scaling and installation with a standard user account. The installer itself has not been exercised interactively.

          This release contains the Windows installer only. macOS and Linux binaries are not included. `SHA256SUMS.txt` records the installer checksum.
          ''')
          PY
      - name: Create a new prerelease without replacing existing tags or releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FONTCATCH_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${FONTCATCH_VERSION}"
          refs=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" --jq '.[].ref')
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')
          if grep -Fxq "refs/tags/$tag" <<< "$refs" || grep -Fxq "$tag" <<< "$releases"; then
            echo "Refusing to replace an existing tag or release: $tag" >&2
            exit 1
          fi
          # Creating a reference fails if it appeared after the checks above.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" --silent
          gh release create "$tag" \
            "$RUNNER_TEMP/fontcatch-preview/Fontcatch_${FONTCATCH_VERSION}_x64-setup.exe" \
            "$RUNNER_TEMP/fontcatch-preview/SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --verify-tag \
            --prerelease --latest=false --title "Fontcatch ${FONTCATCH_VERSION} — Windows preview" \
            --notes-file "$RUNNER_TEMP/fontcatch-preview/release-notes.md"
